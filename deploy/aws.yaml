AWSTemplateFormatVersion: "2010-09-09"
Description: DeckFinder storage, indexing queue, identity and EC2 permissions
Parameters:
  DeckBucketName:
    Type: String
    Description: Globally unique S3 bucket name in this AWS partition
  CognitoDomainPrefix:
    Type: String
    Description: Unique Cognito managed-login domain prefix in the selected region
  SiteUrl:
    Type: String
    Description: HTTPS site origin followed by / (for example https://decks.example.edu/)
    AllowedPattern: "https://[^/]+/"
Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  IndexQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 900
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 4
  IndexQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref IndexQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt IndexQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3:::${DeckBucketName}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
  DeckBucket:
    Type: AWS::S3::Bucket
    DependsOn: IndexQueuePolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref DeckBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt IndexQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: published/
  DeckTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: owner
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: owner
          KeySchema:
            - AttributeName: owner
              KeyType: HASH
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [title, course, status, created_at]
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UserPoolName: !Sub "${AWS::StackName}-users"
  TeacherGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: teachers
      UserPoolId: !Ref UserPool
  StudentGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: students
      UserPoolId: !Ref UserPool
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Ref SiteUrl]
      LogoutURLs: [!Ref SiteUrl]
      PreventUserExistenceErrors: ENABLED
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: deckfinder-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${DeckBucket.Arn}/published/*"
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:BatchGetItem]
                Resource: !GetAtt DeckTable.Arn
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub "${DeckTable.Arn}/index/owner"
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage]
                Resource: !GetAtt IndexQueue.Arn
  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]
Outputs:
  AwsRegion:
    Value: !Ref AWS::Region
  DeckBucket:
    Value: !Ref DeckBucket
  DeckTable:
    Value: !Ref DeckTable
  IndexQueueUrl:
    Value: !Ref IndexQueue
  CognitoPool:
    Value: !Ref UserPool
  CognitoClient:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  InstanceProfile:
    Value: !Ref HostProfile
  DeadLetterQueue:
    Value: !Ref DeadLetterQueue
